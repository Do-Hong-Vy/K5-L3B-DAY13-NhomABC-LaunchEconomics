# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (DE = 1, tổng 2.502; 1.250 nếu z làm tròn)
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu/nhóm -> 42 nhân viên/nhóm (84 > 40 hiện có: KHÔNG đủ người)
#   c) 20 nhân viên mỗi nhóm: giới hạn hiệu dụng c / ICC = 20 / 0,02 = tối đa 1.000 (< 1.251: KHÔNG đạt MDE 5 điểm)
#   d) 6 depot mỗi nhóm: giới hạn hiệu dụng 6 / 0,02 = tối đa 300 (< 1.251; chỉ 6 cụm < 20: KHÔNG đạt)
#   e) Mức chênh 6 điểm (859 hiệu dụng/nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu/người (DE = 6,96; 5.980 yêu cầu thô/nhóm; n hiệu dụng = 859,20)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc song song cùng thời gian tại cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo tài khoản đối chứng và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính, ngưỡng dừng, MDE và ngày quyết định chốt trước khi bật pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (40 nhân viên tổng cộng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chọn chia theo nhân viên (20 + 20) để bảo đảm tách được tác động và đủ 20 cụm/nhóm; chấp nhận tăng MDE lên 6 điểm (m >= 299, 5.980 yêu cầu thô/nhóm, power 0,80). Nếu tác động thật chỉ là 5 điểm ở n hiệu dụng 859, power thực tế chỉ còn 0,6417 (~0,64, thấp hơn mục tiêu 0,80) — nêu rõ con số bất lợi này trong hồ sơ Gate 2a.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại trong đợt chạy thử (chưa có đối chứng) là 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982). Không đặt trần tuyệt đối 3% vì sẽ dừng ngay tuần đầu; dùng ngưỡng so sánh với nhóm đối chứng (>= +2 điểm phần trăm) kèm trần tuyệt đối 6% và phát hiện ca hoàn trùng trong cửa sổ đủ 7 ngày.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại 12 depot (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần (4 -> 10 -> 20 nhân viên can thiệp); đo chỉ số chính khi đủ 20 nhân viên/nhóm và m >= 299
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (nếu tác động thật 5 điểm thì power chỉ đạt 0,6417 ~ 0,64)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng yêu cầu (cỡ mẫu thô 5.980 yêu cầu/nhóm với m >= 299)
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy song song cùng thời gian tại cùng 12 depot"
    spillover_risk: "trung bình (nhân viên cùng depot); giảm bằng khóa quyền truy cập trợ lý theo tài khoản đối chứng và log staff_id"
    predeclared: "đã viết trước chỉ số chính, MDE 0,06 (power 0,64 ở mức 0,05), 3 luật dừng và ngày quyết định"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt 6%, hoặc phát sinh >= 1 ca hoàn tiền trùng TRONG cửa sổ 7 ngày gần nhất THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (simulated) vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được tiếp tục mở cho hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và rà lỗi UX trong 3 ngày KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt hệ thống trợ lý, có hiệu lực trong 30 phút; toàn bộ yêu cầu chuyển về quy trình nhân viên tự xử lý"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (ước lượng thời gian nhân viên xem lại trong đợt chạy thử)"
    - "phut_lam_lai_simulated (ước lượng thời gian nhân viên làm lại trong đợt chạy thử)"
    - "chi_phi_moi_viec_thanh_cong_theo_loai_simulated (0,22x noi_dia, 0,69x hang_nang, 1,88x quoc_te, 0,85x doi_tac)"
    - "nguong_chi_phi_8000d_tu_mo_hinh_simulated"
